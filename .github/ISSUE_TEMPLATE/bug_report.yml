name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve NFT Studio. Do not attach private artwork.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Configure…\n3. Click…"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 130 on Windows 11
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Include console errors or sanitized screenshots when useful.
